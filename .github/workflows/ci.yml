name: CI

on:
  push:
    branches:
      - main
      - Working-baseline
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
        working-directory: projects/FalklandV3

      - name: Lint (ruff)
        run: python -m ruff check .
        working-directory: projects/FalklandV3

      - name: Run tests
        run: pytest
        working-directory: projects/FalklandV3

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: projects/FalklandV3/frontend/stations

      - name: Build
        run: npm run build -- --emptyOutDir
        working-directory: projects/FalklandV3/frontend/stations
