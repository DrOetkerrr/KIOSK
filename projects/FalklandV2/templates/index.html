<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Falklands V2 — Stations</title>
  <!-- CRT theme only; removed old inline styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/crt.css', v=app_version|default('dev')) }}" />
</head>
<body>
  <div id="intro-overlay" class="intro-overlay{% if not intro_active %} hidden{% endif %}" role="presentation" aria-hidden="true">
    <div class="intro-overlay__inner">
      <img class="intro-overlay__art" src="{{ url_for('static', filename='img/intro/intro_bridge.jpg', v=app_version|default('dev')) }}" alt="Bridge view" />
      <div class="intro-overlay__title">Falklands Tactical Console</div>
      <div class="intro-overlay__cta mono">Tap or press any key to begin</div>
    </div>
  </div>
  <div class="wrap">
    <div class="hud">
      <div class="left row"><div id="hud-dot" class="dot"></div><div>Falklands V2 — Stations</div></div>
      <div class="meta mono"><span id="hud-ship">Ship —</span><span id="hud-hdg">hdg —°</span><span id="hud-spd">spd — kn</span></div>
    </div>

    <div class="toolbar">
      <button class="btn" data-st="NAV">NAV</button>
      <button class="btn" data-st="RADAR">RADAR</button>
      <button class="btn" data-st="WPN">WPN</button>
      <button class="btn" data-st="RADIO">COMMS</button>
      <button class="btn" data-st="ENG">ENG</button>
      <button class="btn" data-st="LOG">LOG</button>
      <button class="btn" data-st="SYS">SYS</button>
    </div>

    <div id="station-switches" class="station-switches"></div>

    <div class="window">
      <div id="station-panel" class="panel"></div>
    </div>

  </div>
  <script>
    (function(){
      const introActive = {{ 'true' if intro_active else 'false' }};
      window.__introActive = introActive;
      const overlay = document.getElementById('intro-overlay');
      if(!overlay) return;
      const show = () => overlay.classList.remove('hidden');
      const hide = () => {
        overlay.classList.add('hidden');
      };
      overlay.addEventListener('transitionend', (ev) => {
        if(ev.propertyName === 'opacity' && overlay.classList.contains('hidden')){
          try{ overlay.remove(); }catch(_){ overlay.style.display = 'none'; }
        }
      });
      if(introActive) {
        show();
      }
      window.addEventListener('intro:start', show);
      window.addEventListener('intro:end', hide);
    })();
  </script>
  <script src="{{ url_for('static', filename='sound.js', v=app_version|default('dev')) }}"></script>
  <script src="{{ url_for('static', filename='stations.js', v=app_version|default('dev')) }}" defer></script>
  <script>
    // Fallback if template tags were not rendered or request failed
    if(!window.__stations_loaded){
      document.write('<script src="/static/stations.js?v=dev" defer><\\/script>');
    }
  </script>
</body>
</html>
