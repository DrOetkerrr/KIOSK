<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Falklands V2 — Stations</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#10192b; --border:#21324f; --muted:#8aa0c2;
      --text:#e8f0ff; --ok:#2ecc71; --warn:#f1c40f; --err:#e74c3c; --accent:#3b82f6;
      --shadow:0 6px 18px rgba(0,0,0,0.25);
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#08101f,#0b1220);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{max-width:960px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
    .hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
    .hud .dot{width:10px;height:10px;border-radius:999px;background:var(--err)}
    .hud .dot.ok{background:var(--ok)}
    .hud .meta{display:flex;gap:10px;color:#cfe1ff}
    .window{width:800px;height:480px;background:#0e1a34;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin:0 auto;padding:10px}
    .toolbar{display:flex;justify-content:center;gap:8px}
    .btn{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:#112147;color:var(--text);cursor:pointer;min-width:80px}
    .btn.active{background:#0f2c12;border-color:#1b5e2e;color:#b6f2c9}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .panel{padding:8px}
    h2{margin:0 0 8px;font-size:16px;color:#cfe1ff}
    table{width:100%;border-collapse:separate;border-spacing:0 6px}
    th,td{padding:6px 8px;vertical-align:middle}
    th{font-weight:600;color:#c0d6ff;text-align:left;font-size:12px}
    tbody tr{background:#102044;border:1px solid var(--border)}
    tbody tr td:first-child{border-top-left-radius:6px;border-bottom-left-radius:6px}
    tbody tr td:last-child{border-top-right-radius:6px;border-bottom-right-radius:6px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
    .num{text-align:right;font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)}
    .ok{color:var(--ok)} .err{color:var(--err)} .warn{color:var(--warn)}
    .statdot{width:10px;height:10px;border-radius:999px;display:inline-block;background:#6b7280}
    .statdot.on{background:#35d07f}
    .scroll{overflow:auto;max-height:365px}
    .section{margin-bottom:8px}
    .input{padding:6px;border-radius:6px;border:1px solid var(--border);background:#0c152b;color:#fff}
    .badge{padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:#0e1a34;color:#cfe1ff}
    .tag{display:inline-block;padding:2px 6px;border-radius:6px;background:#0e1a34;border:1px solid var(--border);}
    .tag.green{background:#052412;border-color:#1a5a36;color:#b6f2c9}
    .tag.red{background:#2a1212;border-color:#6b1f1f;color:#ffb4b4}
    .tag.grey{background:#1f2937;border-color:#374151;color:#d1d5db}
    .radio-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="left row"><div id="hud-dot" class="dot"></div><div>Falklands V2 — Stations</div></div>
      <div class="meta mono"><span id="hud-ship">Ship —</span><span id="hud-hdg">hdg —°</span><span id="hud-spd">spd — kn</span></div>
    </div>

    <div class="window">
      <div id="station-panel" class="panel"></div>
    </div>

    <div class="toolbar">
      <button class="btn" data-st="NAV">NAV</button>
      <button class="btn" data-st="RADAR">RADAR</button>
      <button class="btn" data-st="WPN">WPN</button>
      <button class="btn" data-st="RADIO">RADIO</button>
      <button class="btn" data-st="ENG">ENG</button>
      <button class="btn" data-st="SYS">SYS</button>
    </div>

    <div class="radio-box">
      <h3 style="margin:0 0 6px">Radio</h3>
      <div id="radio-list" class="scroll" style="max-height:120px"></div>
      <div class="row" style="margin-top:8px">
        <input id="radio-input" class="input mono" placeholder="Type to an officer (e.g., 'Radar, nearest contact?')" style="flex:1;min-width:200px" />
        <button id="radio-send" class="btn">Send</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='sound.js', v=app_version|default('dev')) }}"></script>
  <script src="{{ url_for('static', filename='stations.js', v=app_version|default('dev')) }}" defer></script>
  <script>
    // Fallback if template tags were not rendered or request failed
    if(!window.__stations_loaded){
      document.write('<script src="/static/stations.js?v=dev" defer><\\/script>');
    }
  </script>
</body>
</html>
